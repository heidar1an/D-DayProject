    <meta

    <meta property="og:site_name" content="تپش" />
    <meta property="og:title" content="تپش | یادگیری پزشکی ساده‌تر" />
    <meta
      property="og:description"
      content="تپش؛ پلتفرم یادگیری پزشکی و آمادگی برای آزمون‌های علوم پزشکی"
    />
    <meta property="og:locale" content="fa_IR" />
    <title>تپش | یادگیری پزشکی ساده‌تر</title>
    <!--
      ── پیش‌بارگذاری فونت ──
      چرا لازم است: مرورگر فایل فونت را فقط وقتی درخواست می‌کند که متنی واقعاً با
      آن فونت رندر شود. این پروژه SPA است، پس آن لحظه = لحظهٔ رندر React؛ یعنی
      دانلود فونت تازه **بعد از** بارگذاری کل جاوااسکریپت شروع می‌شود و کاربر تا
      رسیدنش متن را با فونت پشتیبان می‌بیند (سنجیده‌شده: شروع درخواست فونت ۳۱ms
      بعد از اولین رنگ‌آمیزی، پایانش ~۱ ثانیه بعد ⇒ همان پرش فونت).
      با `preload` دانلود همزمان با خودِ HTML شروع می‌شود و قبل از اولین رنگ‌آمیزی
      متن می‌رسد، پس هیچ متنی با فونت اشتباه دیده نمی‌شود.

      این چهار فایل همان‌هایی‌اند که صفحهٔ اول واقعاً مصرف می‌کند
      (با `CSS.getPlatformFontsForNode` سنجیده شد): Pinar برای بدنه و Doran
      برای ۴۰۰/۵۰۰/۷۰۰. وزن‌های ۸۰۰/۹۰۰ Doran فقط در تیترهای پایین‌تر صفحه‌اند و
      پیش‌بارگذاری نمی‌شوند تا پهنای باند بی‌دلیل مصرف نشود.

      `crossorigin` برای فونت **الزامی** است (فونت با CORS گرفته می‌شود)؛ بدون آن
      مرورگر فایل را دو بار می‌گیرد. ویت در بیلد همین مسیرها را به نام هش‌شدهٔ
      `assets/` بازنویسی می‌کند، پس این خطوط در پروداکشن هم درست کار می‌کنند.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./fonts/pinar/Pinar-VF[DSTY,KSHD,wght].woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./fonts/doran/Doran-Regular.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./fonts/doran/Doran-Medium.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./fonts/doran/Doran-Bold.woff2"
    />
    <script>
      /*
       * ضد پرش تم — قبل از اولین رنگ‌آمیزی اجرا می‌شود تا صفحه با تم اشتباه
       * (تیره) بالا نیاید و بعد روشن شود. کلید و مقادیرش باید با
       * src/services/theme/themeService.js یکی بماند.
       * تم تیره پیش‌فرض است، پس در آن حالت اتریبیوت گذاشته نمی‌شود.
       */
      (function () {
        try {
          var theme = window.localStorage.getItem('tapesh:theme');
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f4f5f7');
          }
        } catch (error) {
          /* دسترسی به localStorage ممکن نیست؛ تم پیش‌فرض تیره می‌ماند */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
